name: Node.js Package

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v2.0.0

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies (no optional Playwright)
        run: npm ci --no-optional

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check current version
        id: check_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${{ steps.extract_version.outputs.VERSION }}
          if [ "$CURRENT_VERSION" != "$TAG_VERSION" ]; then
            echo "UPDATE_VERSION=true" >> $GITHUB_OUTPUT
          else
            echo "UPDATE_VERSION=false" >> $GITHUB_OUTPUT
          fi
          echo "Current: $CURRENT_VERSION, Tag: $TAG_VERSION"

      - name: Update version in package.json
        if: steps.check_version.outputs.UPDATE_VERSION == 'true'
        run: npm version ${{ steps.extract_version.outputs.VERSION }} --no-git-tag-version

      - name: Smoke test (loads without Playwright)
        run: |
          node -e "const KBBI = require('./kbbi.js'); const k = new KBBI(); if (typeof k.lookup !== 'function') process.exit(1);"
          node cli.js --help > /dev/null

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
